<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Storyboard - Zachary Lost in City</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f0f0f0;
            padding: 20px;
            font-family: 'Quicksand', 'Poppins', sans-serif;
        }
        
        .manga-container {
            width: 834px;
            height: 1194px;
            margin: 0 auto;
            background: white;
            padding: 10px;
            position: relative;
        }
        
        .manga-page {
            width: 834px;
            height: 1194px;
            background: #fff;
            border: 2px solid #000;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }
        
        .panel {
            position: absolute;
            border: 2px solid #000;
            border-radius: 4px;
            overflow: hidden;
            background: #f5f5f5;
        }
        
        .panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .dialog-bubble {
            position: absolute;
            background: white;
            padding: 12px 16px;
            border-radius: 20px;
            border: 2px solid #000;
            font-size: 14px;
            font-weight: bold;
            max-width: 80%;
            z-index: 10;
        }
        
        .dialog-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #000 transparent;
        }
        
        .thinking-bubble {
            position: absolute;
            background: white;
            padding: 8px;
            border-radius: 50%;
            border: 2px solid #000;
            font-size: 12px;
            z-index: 10;
        }
        
        .thinking-bubble::before {
            content: 'o  o  o';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #666;
        }
        
        .panel-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .motion-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, transparent 0%, #ff6b6b 50%, transparent 100%),
                repeating-linear-gradient(0deg, transparent 0, transparent 10px, #ff6b6b 10px, #ff6b6b 20px);
            opacity: 0.3;
            animation: motion 0.5s infinite linear;
        }
        
        @keyframes motion {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 20px 0, 20px 0; }
        }
        
        @media (max-width: 768px) {
            .manga-page {
                width: 100%;
                height: auto;
                overflow-y: scroll;
            }
        }
        
        /* Panel 1: Full width, top row */
        .panel-1 {
            top: 10px;
            left: 10px;
            width: 814px;
            height: 380px;
        }
        
        /* Panel 2: Left, second row */
        .panel-2 {
            top: 410px;
            left: 10px;
            width: 290px;
            height: 290px;
        }
        
        /* Panel 3: Right, second row (same height as panel 2) */
        .panel-3 {
            top: 410px;
            left: 310px;
            width: 514px;
            height: 290px;
        }
        
        /* Panel 4: Full width, third row */
        .panel-4 {
            top: 720px;
            left: 10px;
            width: 814px;
            height: 190px;
        }
        
        /* Panel 5: Left, fourth row */
        .panel-5 {
            top: 930px;
            left: 10px;
            width: 190px;
            height: 244px;
        }
        
        /* Panel 6: Right, fourth row (same height as panel 5) */
        .panel-6 {
            top: 930px;
            left: 210px;
            width: 614px;
            height: 244px;
        }
    </style>
</head>
<body>
    <div class="manga-container">
        <h1 class="manga-title" style="text-align: center; color: #000; font-size: 2rem; margin-bottom: 20px; font-weight: bold;">Zachary's Adventure</h1>
        
        <div class="manga-page">
            <!-- Panel 1: Establishing shot (Full width, top row) -->
            <div class="panel panel-1">
                <span class="panel-label">1</span>
            </div>
            
            <!-- Panel 2: Scared close-up (Left, second row) -->
            <div class="panel panel-2">
                <span class="panel-label">2</span>
            </div>
            
            <!-- Panel 3: Determined face (Right, second row) -->
            <div class="panel panel-3">
                <span class="panel-label">3</span>
            </div>
            
            <!-- Panel 4: Wide action (Full width, third row) -->
            <div class="panel panel-4">
                <span class="panel-label">4</span>
            </div>
            
            <!-- Panel 5: Tall action shot (Left, fourth row) -->
            <div class="panel panel-5">
                <span class="panel-label">5</span>
            </div>
            
            <!-- Panel 6: Motion lines (Right, fourth row) -->
            <div class="panel panel-6">
                <span class="panel-label">6</span>
            </div>
        </div>
    </div>
</body>
</html>
