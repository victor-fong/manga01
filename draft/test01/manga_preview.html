<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Page Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f0f0f0;
            padding: 20px;
            font-family: 'Quicksand', 'Poppins', sans-serif;
        }
        
        .manga-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .manga-title {
            text-align: center;
            color: #D32F2F;
            font-size: 2rem;
            margin-bottom: 30px;
            font-weight: bold;
        }
        
        .manga-page {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
            background: #fff;
            border: 2px solid #D32F2F;
            border-radius: 8px;
        }
        
        .panel {
            position: relative;
            border: 3px solid #D32F2F;
            border-radius: 8px;
            overflow: hidden;
            background: #f5f5f5;
        }
        
        .panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .dialog-bubble {
            position: absolute;
            background: white;
            padding: 12px 16px;
            border-radius: 20px;
            border: 2px solid #333;
            font-size: 14px;
            font-weight: bold;
            max-width: 80%;
            z-index: 10;
        }
        
        .dialog-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 20px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #333 transparent;
        }
        
        .panel-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(211, 47, 47, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .panel-large {
            grid-column: span 2;
            height: 400px;
        }
        
        .panel-medium {
            grid-column: span 1;
            height: 300px;
        }
        
        .panel-small {
            grid-column: span 1;
            height: 150px;
        }
        
        .motion-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, transparent 0%, #ff6b6b 50%, transparent 100%),
                repeating-linear-gradient(0deg, transparent 0, transparent 10px, #ff6b6b 10px, #ff6b6b 20px);
            opacity: 0.3;
            animation: motion 0.5s infinite linear;
        }
        
        @keyframes motion {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 20px 0, 20px 0; }
        }
        
        @media (max-width: 768px) {
            .manga-page {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(6, 1fr);
            }
            
            .panel-large {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="manga-container">
        <h1 class="manga-title">Zachary's Adventure</h1>
        
        <div class="manga-page">
            <!-- Panel 1: Establishing shot -->
            <div class="panel panel-large">
                <span class="panel-label">1</span>
                <img src="zachary_bicycle_ride.png" alt="Zachary riding bicycle">
            </div>
            
            <!-- Panel 2: Close-up with dialog -->
            <div class="panel panel-medium">
                <span class="panel-label">2</span>
                <img src="zachary_closeup_front_view.png" alt="Zachary's face">
                <div class="dialog-bubble" style="top: 20px; right: 20px;">
                    "I can make it!"
                </div>
            </div>
            
            <!-- Panel 3: Motion lines -->
            <div class="panel panel-small">
                <span class="panel-label">3</span>
                <div class="motion-lines"></div>
            </div>
            
            <!-- Panel 4: Background detail -->
            <div class="panel panel-medium">
                <span class="panel-label">4</span>
                <div style="width: 100%; height: 100%; background: linear-gradient(to bottom, #87CEEB, #FFD700);"></div>
            </div>
            
            <!-- Panel 5: Action shot -->
            <div class="panel panel-large">
                <span class="panel-label">5</span>
                <div style="width: 100%; height: 100%; background: linear-gradient(to right, #87CEEB, #90EE90);"></div>
            </div>
        </div>
    </div>
</body>
</html>
