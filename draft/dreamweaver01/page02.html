<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dreamweaver's Secret - Page 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f5f5f5;
            padding: 20px;
            font-family: 'Quicksand', 'Poppins', sans-serif;
        }
        
        .manga-container {
            width: 834px;
            height: 1194px;
            margin: 0 auto;
            background: white;
            padding: 10px;
            position: relative;
        }
        
        .manga-page {
            width: 834px;
            height: 1194px;
            background: #fff;
            border: 2px solid #000;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }
        
        .panel {
            position: absolute;
            border: 2px solid #000;
            border-radius: 4px;
            overflow: hidden;
            background: #f5f5f5;
        }
        
        .panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .dialog-bubble {
            position: absolute;
            background: white;
            padding: 12px 16px;
            border-radius: 20px;
            border: 2px solid #000;
            font-size: 14px;
            font-weight: bold;
            max-width: 80%;
            z-index: 10;
        }
        
        .dialog-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #000 transparent;
        }
        
        .thinking-bubble {
            position: absolute;
            background: white;
            padding: 8px;
            border-radius: 50%;
            border: 2px solid #000;
            font-size: 12px;
            z-index: 10;
        }
        
        .thinking-bubble::before {
            content: 'o  o  o';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #666;
        }
        
        .panel-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .manga-page {
                width: 100%;
                height: auto;
                overflow-y: scroll;
            }
        }
        
        /* Page 2 Layout - Studio Ghibli Style */
        .page2 {
            width: 834px;
            height: 1194px;
        }
        
        /* Panel 1: Combined - Both boys with light (Full width, top) */
        .panel-combined {
            top: 10px;
            left: 10px;
            width: 814px;
            height: 560px;
        }
        
        /* Panel 2: Asher touching light (Left, second row) */
        .panel-asher-touching {
            top: 584px;
            left: 10px;
            width: 390px;
            height: 280px;
        }
        
        /* Panel 3: Zachary affected (Right, second row - same height as panel 2) */
        .panel-zachary-affected {
            top: 584px;
            left: 414px;
            width: 410px;
            height: 280px;
        }
        
        /* Panel 4: Portal pulling (Full width, third row) */
        .panel-portal-pulling {
            top: 874px;
            left: 10px;
            width: 814px;
            height: 280px;
        }
    </style>
</head>
<body>
    <div class="manga-container">
        <h1 class="manga-title" style="text-align: center; color: #000; font-size: 2rem; margin-bottom: 20px; font-weight: bold;">The Dreamweaver's Secret - Page 2</h1>
        
        <div class="manga-page page2">
            <!-- Panel 1: Combined - Both boys with light (Full width, top) -->
            <div class="panel panel-combined">
                <span class="panel-label">1</span>
                <img src="page02_panel01.png" alt="Zachary and Asher seeing the glowing light together">
                <div class="dialog-bubble" style="top: 70px; left: 120px;">
                    "Look! A magical light!"
                </div>
                <div class="dialog-bubble" style="top: 20px; left: 320px;">
                    "Wait, Asher! Be careful!"
                </div>
            </div>
            
            <!-- Panel 2: Asher touching light (Left, second row) -->
            <div class="panel panel-asher-touching">
                <span class="panel-label">2</span>
                <img src="page02_panel02.png" alt="Asher's hand touching the glowing light with magical effect">
                <div class="dialog-bubble" style="top: 20px; right: 20px;">
                    "It's warm!"
                </div>
            </div>
            
            <!-- Panel 3: Zachary affected (Right, second row) -->
            <div class="panel panel-zachary-affected">
                <span class="panel-label">3</span>
                <img src="page02_panel03.png" alt="Zachary seeing Asher touched by the light, surprised">
            </div>
            
            <!-- Panel 4: Portal pulling (Full width, third row) -->
            <div class="panel panel-portal-pulling">
                <span class="panel-label">4</span>
                <img src="page02_panel04.png" alt="Magical light swirling into portal, pulling boys toward it">
                <div class="dialog-bubble" style="bottom: 15px; left: 20px;">
                    "Whoa! It's pulling us!"
                </div>
            </div>
        </div>
    </div>
</body>
</html>
