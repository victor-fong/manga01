<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dreamweaver's Secret - Page 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f5f5f5;
            padding: 20px;
            font-family: 'Quicksand', 'Poppins', sans-serif;
        }
        
        .manga-container {
            width: 834px;
            height: 1194px;
            margin: 0 auto;
            background: white;
            padding: 10px;
            position: relative;
        }
        
        .manga-page {
            width: 834px;
            height: 1194px;
            background: #fff;
            border: 2px solid #000;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }
        
        .panel {
            position: absolute;
            border: 2px solid #000;
            border-radius: 4px;
            overflow: hidden;
            background: #f5f5f5;
        }
        
        .panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .dialog-bubble {
            position: absolute;
            background: white;
            padding: 12px 16px;
            border-radius: 20px;
            border: 2px solid #000;
            font-size: 14px;
            font-weight: bold;
            max-width: 80%;
            z-index: 10;
        }
        
        .dialog-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #000 transparent;
        }
        
        .thinking-bubble {
            position: absolute;
            background: white;
            padding: 8px;
            border-radius: 50%;
            border: 2px solid #000;
            font-size: 12px;
            z-index: 10;
        }
        
        .thinking-bubble::before {
            content: 'o  o  o';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #666;
        }
        
        .panel-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .manga-page {
                width: 100%;
                height: auto;
                overflow-y: scroll;
            }
        }
        
        /* Page 3 Layout - Studio Ghibli Style */
        .page3 {
            width: 834px;
            height: 1194px;
        }
        
        /* Panel 1: Big frame showing dream realm entrance (Full width, top) */
        .panel-dream-entrance {
            top: 10px;
            left: 10px;
            width: 814px;
            height: 764px;
        }
        
        /* Panel 2: Zachary's cool look (Left, second row - smaller) */
        .panel-zachary-cool {
            top: 794px;
            left: 10px;
            width: 390px;
            height: 380px;
        }
        
        /* Panel 3: Asher's cool look (Right, second row - same height as panel 2) */
        .panel-asher-cool {
            top: 794px;
            left: 414px;
            width: 410px;
            height: 380px;
        }
    </style>
</head>
<body>
    <div class="manga-container">
        <h1 class="manga-title" style="text-align: center; color: #000; font-size: 2rem; margin-bottom: 20px; font-weight: bold;">The Dreamweaver's Secret - Page 3</h1>
        
        <div class="manga-page page3">
            <!-- Panel 1: Big frame showing dream realm entrance with both boys -->
            <div class="panel panel-dream-entrance">
                <span class="panel-label">1</span>
                <img src="page03_panel01.png" alt="Zachary and Asher standing at the entrance of a magical dream realm, glowing portal behind them">
                <div class="dialog-bubble" style="top: 70px; left: 120px;">
                    "Whoa! Look at this place!"
                </div>
                <div class="dialog-bubble" style="top: 20px; left: 320px;">
                    "We made it to the Dream Realm!"
                </div>
            </div>
            
            <!-- Panel 2: Zachary's cool dream look -->
            <div class="panel panel-zachary-cool">
                <span class="panel-label">2</span>
                <img src="page03_panel02.png" alt="Zachary's cool dream look with blue glasses, wearing futuristic dream armor with silver and blue colors, holding a staff with glowing crystal">
            </div>
            
            <!-- Panel 3: Asher's cool dream look -->
            <div class="panel panel-asher-cool">
                <span class="panel-label">3</span>
                <img src="page03_panel03.png" alt="Asher's cool dream look with red and blue striped pajamas transformed into futuristic warrior outfit, wearing a sword with magical energy">
            </div>
        </div>
    </div>
</body>
</html>
