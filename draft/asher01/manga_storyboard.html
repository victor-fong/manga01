<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Storyboard - Asher's Capybara Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f0f0f0;
            padding: 20px;
            font-family: 'Quicksand', 'Poppins', sans-serif;
        }
        
        .manga-container {
            width: 834px;
            height: 1294px;
            margin: 0 auto;
            background: white;
            padding: 10px;
            position: relative;
        }
        
        .manga-page {
            width: 834px;
            height: 1294px;
            background: #fff;
            border: 2px solid #000;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }
        
        .panel {
            position: absolute;
            border: 2px solid #000;
            border-radius: 4px;
            overflow: hidden;
            background: #f5f5f5;
        }
        
        .panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .dialog-bubble {
            position: absolute;
            background: white;
            padding: 12px 16px;
            border-radius: 20px;
            border: 2px solid #000;
            font-size: 14px;
            font-weight: bold;
            max-width: 80%;
            z-index: 10;
        }
        
        .dialog-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #000 transparent;
        }
        
        .thinking-bubble {
            position: absolute;
            background: white;
            padding: 8px;
            border-radius: 50%;
            border: 2px solid #000;
            font-size: 12px;
            z-index: 10;
        }
        
        .thinking-bubble::before {
            content: 'o  o  o';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #666;
        }
        
        .panel-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .motion-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, transparent 0%, #ff6b6b 50%, transparent 100%),
                repeating-linear-gradient(0deg, transparent 0, transparent 10px, #ff6b6b 10px, #ff6b6b 20px);
            opacity: 0.3;
            animation: motion 0.5s infinite linear;
        }
        
        @keyframes motion {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 20px 0, 20px 0; }
        }
        
        @media (max-width: 768px) {
            .manga-page {
                width: 100%;
                height: auto;
                overflow-y: scroll;
            }
        }
        
        /* Panel 1: Full width, top row - Establishing shot */
        .panel-1 {
            top: 10px;
            left: 10px;
            width: 814px;
            height: 400px;
        }
        
        /* Panel 2: Left, second row - Capybara appearing */
        .panel-2 {
            top: 430px;
            left: 10px;
            width: 320px;
            height: 300px;
        }
        
        /* Panel 3: Right, second row - Asher's reaction */
        .panel-3 {
            top: 430px;
            left: 340px;
            width: 484px;
            height: 300px;
        }
        
        /* Panel 4: Full width, third row - Offering carrot */
        .panel-4 {
            top: 750px;
            left: 10px;
            width: 814px;
            height: 300px;
        }
        
        /* Panel 5: Left, fourth row - Capybara approaches */
        .panel-5 {
            top: 1070px;
            left: 10px;
            width: 220px;
            height: 204px;
        }
        
        /* Panel 6: Right, fourth row - Friendship hug */
        .panel-6 {
            top: 1070px;
            left: 240px;
            width: 584px;
            height: 204px;
        }
    </style>
</head>
<body>
    <div class="manga-container">
        <h1 class="manga-title" style="text-align: center; color: #000; font-size: 2rem; margin-bottom: 20px; font-weight: bold;">Asher's Capybara Adventure</h1>
        
        <div class="manga-page">
            <!-- Panel 1: Establishing shot (Full width, top row) -->
            <div class="panel panel-1">
                <span class="panel-label">1</span>
                <img src="page01_panel01.png" alt="Large backyard with white fence with gaps, grass, sunny summer day">
                <div class="dialog-bubble" style="top: 20px; left: 20px;">
                    What a sunny day!
                </div>
            </div>
            
            <!-- Panel 2: Capybara appearance (Left, second row) -->
            <div class="panel panel-2">
                <span class="panel-label">2</span>
                <img src="page01_panel02.png" alt="Cute capybara peeking from behind the white fence">
            </div>
            
            <!-- Panel 3: Asher's reaction (Right, second row) -->
            <div class="panel panel-3">
                <span class="panel-label">3</span>
                <img src="page01_panel03.png" alt="Asher happy and excited, seeing the capybara">
                <div class="dialog-bubble" style="top: 20px; right: 20px;">
                    Wow! A capybara!
                </div>
            </div>
            
            <!-- Panel 4: Offering the carrot (Full width, third row) -->
            <div class="panel panel-4">
                <span class="panel-label">4</span>
                <img src="page01_panel04.png" alt="Asher feeding the capybara with carrot">
                <div class="dialog-bubble" style="top: 20px; right: 20px;">
                    Come have some carrot!
                </div>
            </div>
            
            <!-- Panel 5: Capybara approaches (Left, fourth row) -->
            <div class="panel panel-5">
                <span class="panel-label">5</span>
                <img src="page01_panel05.png" alt="Capybara slowly moving forward toward Asher">
            </div>
            
            <!-- Panel 6: Friendship hug (Right, fourth row) -->
            <div class="panel panel-6">
                <span class="panel-label">6</span>
                <img src="page01_panel06.png" alt="Asher hugging the capybara with TAMED celebration">
                <div class="dialog-bubble" style="top: 20px; right: 20px;">
                    TAMED!
                </div>
            </div>
        </div>
    </div>
</body>
</html>
